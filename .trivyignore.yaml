# Accepted vulnerability exceptions.
#
# An entry here is a decision, not a mute. Every one carries a statement saying
# why it cannot be fixed here, and an `expired_at` after which Trivy reports it
# again — so an exception that outlives its reason fails the build instead of
# quietly surviving forever.
#
# Do not add an entry for something a version bump would fix. `--ignore-unfixed`
# already drops advisories with no upstream patch, so anything reaching this
# file has a patch that we specifically cannot apply.
#
# Each entry is scoped to the one binary it was assessed in. The same CVE turning
# up anywhere else is a new finding, not covered by this decision.
#
# History: CVE-2026-56854 (golang.org/x/crypto < 0.55.0, vendored into the
# KrakenD binary) lived here while images/ci/krakend was pinned to
# krakend:2.13.4, and left when 2.13.11 shipped x/crypto v0.56.0.
# CVE-2026-56864, CVE-2026-56865 (x/mod) and CVE-2026-84445 (grpc), vendored
# into krakend 2.13.11 with no 2.x fix, left with the move to krakend:3.0.1.
vulnerabilities:
  # docker-buildx-plugin from the Docker CE repository, on the two Oracle Linux
  # images. Every buildx release up to v0.38.0-rc2 still vendors go-archive
  # v0.2.0; the Alpine images ship an older buildx that does not use the
  # affected code. Drop this when a buildx release vendors go-archive >= 0.3.0.
  - id: CVE-2026-17106
    paths:
      - usr/libexec/docker/cli-plugins/docker-buildx
    statement: >-
      Arbitrary file write via link following when extracting a tar. Needs a
      crafted archive handed to buildx inside a CI job, which already runs the
      repository's own code with the same privileges. No buildx release ships
      go-archive >= 0.3.0 yet.
    expired_at: 2026-11-07
