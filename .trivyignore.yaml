# Accepted vulnerability exceptions.
#
# An entry here is a decision, not a mute. Every one carries a statement saying
# why it cannot be fixed here, and an `expired_at` after which Trivy reports it
# again — so an exception that outlives its reason fails the build instead of
# quietly surviving forever.
#
# Do not add an entry for something a version bump would fix. `--ignore-unfixed`
# already drops advisories with no upstream patch, so anything reaching this
# file has a patch that we specifically cannot apply.

# Empty by design. CVE-2026-56854 (golang.org/x/crypto < 0.55.0, vendored into
# the KrakenD binary) lived here while images/ci/krakend was pinned to
# krakend:2.13.4. It ships x/crypto v0.56.0 as of 2.13.11, so the exception has
# no subject left.
vulnerabilities: []
