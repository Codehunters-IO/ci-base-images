server {
    # 8080, not 80: ports below 1024 need CAP_NET_BIND_SERVICE, which a
    # non-root worker does not have.
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    add_header X-Content-Type-Options    "nosniff"          always;
    add_header X-Frame-Options           "SAMEORIGIN"       always;
    add_header Referrer-Policy           "no-referrer-when-downgrade" always;
    add_header Cross-Origin-Opener-Policy "same-origin"     always;

    # Hashed asset filenames are immutable; index.html is not, or a deploy would
    # never reach a browser that already has it.
    location ~* \.(?:css|js|woff2?|png|jpg|jpeg|gif|svg|ico|webp|avif)$ {
        # One Cache-Control, not two: `expires` emits its own, and pairing it
        # with add_header sends the header twice.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # SPA fallback: client-side routes are not files on disk, so anything that
    # does not resolve is handed to the router instead of 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
