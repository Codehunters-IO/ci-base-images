name: Scheduled Image Scan

# Rescan of what is already published.
#
# The PR gate and the publish gate both check an image at the moment it is
# built. That is the one moment it is least likely to be vulnerable. Advisories
# land against packages that were already shipped, so an image that passed every
# gate in the repository is quietly wrong three weeks later and nothing in the
# pipeline says so. This is the job that says so.
#
# The work lives in Codehunters-IO/ci-templates.

on:
  schedule:
    # Monday 06:00 UTC — before the week's work, after the weekend's advisories.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver to scan (e.g. 1.2.0). Empty scans the rolling tags from main.'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  packages: read
  security-events: write

jobs:
  scan:
    # Pinned, not @v1 — see the note in pr-validation.yml.
    uses: Codehunters-IO/ci-templates/.github/workflows/shared-scan-published-images.yml@212e85796d4c9a646ce12f979df9f923e4d01582 # v1.5.0
    with:
      # A version older than a variant fails on that variant, because the tag
      # was never published: the Java 25 family arrived in 1.2.0, so scanning
      # 1.1.0 asks for :1.1.0-jdk25, which does not exist. The scheduled run
      # passes nothing and scans the rolling tags, which is the case that
      # matters — those are what consumers on a rolling tag actually pull.
      version: ${{ inputs.version || '' }}
      trivyignores: '.trivyignore.yaml'
      ignore_policy: '.trivy/ignore-policy.rego'
      images: |
        [
          {"name": "jdk",            "rolling_tag": "latest",         "tag_suffix": "",                "scan_severity": "CRITICAL"},
          {"name": "jdk25",          "rolling_tag": "jdk25",          "tag_suffix": "-jdk25",          "scan_severity": "CRITICAL"},
          {"name": "graalvm",        "rolling_tag": "graalvm",        "tag_suffix": "-graalvm",        "scan_severity": "CRITICAL"},
          {"name": "graalvm25",      "rolling_tag": "graalvm25",      "tag_suffix": "-graalvm25",      "scan_severity": "CRITICAL"},
          {"name": "krakend",        "rolling_tag": "krakend",        "tag_suffix": "-krakend",        "scan_severity": "CRITICAL"},
          {"name": "node",           "rolling_tag": "node",           "tag_suffix": "-node",           "scan_severity": "CRITICAL"},
          {"name": "java-runtime",   "rolling_tag": "java-runtime",   "tag_suffix": "-java-runtime",   "scan_severity": "CRITICAL,HIGH"},
          {"name": "java25-runtime", "rolling_tag": "java25-runtime", "tag_suffix": "-java25-runtime", "scan_severity": "CRITICAL,HIGH"},
          {"name": "node-runtime",   "rolling_tag": "node-runtime",   "tag_suffix": "-node-runtime",   "scan_severity": "CRITICAL,HIGH"},
          {"name": "web-runtime",    "rolling_tag": "web-runtime",    "tag_suffix": "-web-runtime",    "scan_severity": "CRITICAL,HIGH"},
          {"name": "native-runtime", "rolling_tag": "native-runtime", "tag_suffix": "-native-runtime", "scan_severity": "CRITICAL,HIGH"}
        ]
