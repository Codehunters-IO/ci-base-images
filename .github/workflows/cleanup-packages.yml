# Weekly pruning of untagged versions from ghcr.io/codehunters-io/ci-base-images.
#
# This package accumulates faster than most: eleven variants, each pushed as a
# multi-arch manifest with an SBOM and provenance, means one publish leaves
# several unreferenced manifests behind. 230 versions when this was written,
# against eight variants; the Java 25 family makes each publish larger still.
#
# Most untagged versions here are NOT garbage. 192 of the 222 are platform or
# attestation manifests belonging to a tagged image - untagged because only the
# manifest list carries the tag. v1.3.0 of the reusable workflow is the first
# that reads the registry and protects them; before it, this would have deleted
# them and broken `docker pull` on every tag in the package. v1.3.1 also keeps
# retention on image boundaries, so what it does keep is whole.
#
# Releases are pruned too: only the newest semver release is kept
# (keep_releases, ci-templates v1.7.0+). Older releases, their X.Y / X aliases
# and every sha-* build tag are retired with their whole image. Rolling tags
# and anything unrecognised are never touched. A consumer pinned to a retired
# release fails on its next pull, which is why the README states the window.
#
# Two runs delete: build-publish.yml calls this once a v* tag is published and
# signed, which retires the previous release on the spot, and the Sunday run
# sweeps whatever unreferenced versions the week left behind. A failed publish
# or signature skips the call, so a broken release never retires a good one.
# A manual dispatch defaults to a dry run, for reading the plan first.
name: Cleanup Packages

on:
  schedule:
    # Sunday 04:00 UTC — after the week's releases, before Monday.
    - cron: '0 4 * * 0'
  workflow_call:
    inputs:
      dry_run:
        description: 'Only report what would be deleted'
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only report what would be deleted'
        required: false
        type: boolean
        default: true

permissions:
  packages: write

jobs:
  cleanup:
    # One cleanup at a time across both callers: a release landing during the
    # Sunday run would otherwise plan against a package the other is deleting.
    concurrency:
      group: ghcr-cleanup
      cancel-in-progress: false
    # Pinned, not @main: a reusable workflow resolves at call time, so an
    # unpinned ref means any push to ci-templates changes what runs here
    # with packages: write, without a commit in this repository.
    uses: Codehunters-IO/ci-templates/.github/workflows/shared-cleanup-packages.yml@867252511691415051eb4ac3ab5522d2d4427bb6 # v2.4.2
    with:
      # The current release only. Consumers pin an alias (:2, :2.0) or a
      # rolling tag; see "Supported releases" in the README.
      keep_releases: 1
      # Safe regardless of this value: anything a tag can reach, which is the
      # tagged manifest lists and every platform and attestation manifest under
      # them. Being untagged is not enough to be deleted.
      # On the scheduled run `inputs` is empty, so this evaluates to false and
      # the run deletes. The release call and a dispatch pass their own value.
      dry_run: ${{ inputs.dry_run == true }}
    secrets: inherit
