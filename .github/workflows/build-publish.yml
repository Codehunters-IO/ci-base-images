name: Build & Publish CI Image

# Build, scan and publish every variant as a multi-arch manifest with an SBOM
# and provenance.
#
# The work lives in Codehunters-IO/ci-templates. That workflow was extracted
# from this file: publishing a container image is what every repository that
# ships a service does, and leaving the scanning, the SBOM and the tagging
# rules here meant the next one started from `docker buildx build --push`.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'images/**'
      - 'scripts/**'
      - '.github/workflows/build-publish.yml'
  workflow_dispatch:
    inputs:
      push_rolling:
        description: 'Also move the rolling tags (:latest, :jdk25, :graalvm, ...)'
        required: false
        type: boolean
        default: false

# Not optional, and not inherited: a reusable workflow cannot grant itself more
# than its caller has. Without security-events the Trivy SARIF upload is lost
# silently rather than failing, and without packages the push fails outright.
permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  build-publish:
    # Pinned, not @v1 — see the note in pr-validation.yml.
    uses: Codehunters-IO/ci-templates/.github/workflows/shared-build-publish-image.yml@212e85796d4c9a646ce12f979df9f923e4d01582 # v1.5.0
    with:
      push_rolling: ${{ inputs.push_rolling || false }}
      smoke_command: './scripts/run-smoke.sh'
      trivyignores: '.trivyignore.yaml'
      ignore_policy: '.trivy/ignore-policy.rego'
      # The JDK variant carries no suffix: its tags are the unsuffixed ones, so
      # :latest and :vX.Y.Z are Java 21 and stay that way. Java 25 is opt-in per
      # repository through the -jdk25 / -graalvm25 / -java25-runtime suffixes.
      #
      # See pr-validation.yml for why scan_severity differs per family and why
      # the Java major is not passed in through smoke_env.
      images: |
        [
          {"name": "jdk",            "dockerfile": "images/ci/jdk/Dockerfile",         "tag_suffix": "",                 "rolling_tag": "latest",         "scan_severity": "CRITICAL",      "smoke_env": "KIND=ci\nVARIANT=jdk"},
          {"name": "jdk25",          "dockerfile": "images/ci/jdk25/Dockerfile",       "tag_suffix": "-jdk25",           "rolling_tag": "jdk25",          "scan_severity": "CRITICAL",      "smoke_env": "KIND=ci\nVARIANT=jdk"},
          {"name": "graalvm",        "dockerfile": "images/ci/graalvm/Dockerfile",     "tag_suffix": "-graalvm",         "rolling_tag": "graalvm",        "scan_severity": "CRITICAL",      "smoke_env": "KIND=ci\nVARIANT=graalvm"},
          {"name": "graalvm25",      "dockerfile": "images/ci/graalvm25/Dockerfile",   "tag_suffix": "-graalvm25",       "rolling_tag": "graalvm25",      "scan_severity": "CRITICAL",      "smoke_env": "KIND=ci\nVARIANT=graalvm"},
          {"name": "krakend",        "dockerfile": "images/ci/krakend/Dockerfile",     "tag_suffix": "-krakend",         "rolling_tag": "krakend",        "scan_severity": "CRITICAL",      "smoke_env": "KIND=ci\nVARIANT=krakend"},
          {"name": "node",           "dockerfile": "images/ci/node/Dockerfile",        "tag_suffix": "-node",            "rolling_tag": "node",           "scan_severity": "CRITICAL",      "smoke_env": "KIND=ci\nVARIANT=node"},
          {"name": "java-runtime",   "dockerfile": "images/runtime/java/Dockerfile",   "tag_suffix": "-java-runtime",    "rolling_tag": "java-runtime",   "scan_severity": "CRITICAL,HIGH", "smoke_env": "KIND=runtime\nVARIANT=java"},
          {"name": "java25-runtime", "dockerfile": "images/runtime/java25/Dockerfile", "tag_suffix": "-java25-runtime",  "rolling_tag": "java25-runtime", "scan_severity": "CRITICAL,HIGH", "smoke_env": "KIND=runtime\nVARIANT=java"},
          {"name": "node-runtime",   "dockerfile": "images/runtime/node/Dockerfile",   "tag_suffix": "-node-runtime",    "rolling_tag": "node-runtime",   "scan_severity": "CRITICAL,HIGH", "smoke_env": "KIND=runtime\nVARIANT=node"},
          {"name": "web-runtime",    "dockerfile": "images/runtime/web/Dockerfile",    "tag_suffix": "-web-runtime",     "rolling_tag": "web-runtime",    "scan_severity": "CRITICAL,HIGH", "smoke_env": "KIND=web\nVARIANT=web"},
          {"name": "native-runtime", "dockerfile": "images/runtime/native/Dockerfile", "tag_suffix": "-native-runtime",  "rolling_tag": "native-runtime", "scan_severity": "CRITICAL,HIGH", "smoke_env": "KIND=native"}
        ]
