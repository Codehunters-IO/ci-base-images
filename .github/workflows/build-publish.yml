name: Build & Publish CI Image

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'images/**'
      - 'scripts/**'
      - '.github/workflows/build-publish.yml'
  workflow_dispatch:
    inputs:
      push_latest:
        description: 'Tag as :latest (jdk) / :graalvm / :krakend / :node'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  # Trivy results are uploaded to code scanning, so a CVE that lands after a
  # publish shows up in the Security tab instead of only in a job log nobody
  # reopens.
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-publish:
    name: Build and Push (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        variant: [jdk, graalvm, krakend, node,
                  java-runtime, node-runtime, web-runtime, native-runtime]
        include:
          - variant: jdk
            smoke_kind: ci
            smoke_variant: jdk
            context_dir: images/ci/jdk
            tag_suffix: ''
            rolling_tag: latest
            cache_scope_prefix: jdk-
            scan_severity: 'CRITICAL'
          - variant: graalvm
            smoke_kind: ci
            smoke_variant: graalvm
            context_dir: images/ci/graalvm
            tag_suffix: '-graalvm'
            rolling_tag: graalvm
            cache_scope_prefix: graalvm-
            scan_severity: 'CRITICAL'
          - variant: krakend
            smoke_kind: ci
            smoke_variant: krakend
            context_dir: images/ci/krakend
            tag_suffix: '-krakend'
            rolling_tag: krakend
            cache_scope_prefix: krakend-
            scan_severity: 'CRITICAL'
          - variant: node
            smoke_kind: ci
            smoke_variant: node
            context_dir: images/ci/node
            tag_suffix: '-node'
            rolling_tag: node
            cache_scope_prefix: node-
            scan_severity: 'CRITICAL'
          - variant: java-runtime
            smoke_kind: runtime
            smoke_variant: java
            context_dir: images/runtime/java
            tag_suffix: '-java-runtime'
            rolling_tag: java-runtime
            cache_scope_prefix: java-runtime-
            scan_severity: 'CRITICAL,HIGH'
          - variant: node-runtime
            smoke_kind: runtime
            smoke_variant: node
            context_dir: images/runtime/node
            tag_suffix: '-node-runtime'
            rolling_tag: node-runtime
            cache_scope_prefix: node-runtime-
            scan_severity: 'CRITICAL,HIGH'
          - variant: web-runtime
            smoke_kind: web
            smoke_variant: web
            context_dir: images/runtime/web
            tag_suffix: '-web-runtime'
            rolling_tag: web-runtime
            cache_scope_prefix: web-runtime-
            scan_severity: 'CRITICAL,HIGH'
          - variant: native-runtime
            smoke_kind: native
            smoke_variant: native
            context_dir: images/runtime/native
            tag_suffix: '-native-runtime'
            rolling_tag: native-runtime
            cache_scope_prefix: native-runtime-
            scan_severity: 'CRITICAL,HIGH'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
            suffix=${{ matrix.tag_suffix }},onlatest=true
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
            # suffix= clears the flavor suffix for this entry only. The rolling tag
            # already names the variant, so inheriting it produced graalvm-graalvm,
            # krakend-krakend and node-node on the first successful publish.
            type=raw,value=${{ matrix.rolling_tag }},suffix=,enable=${{ github.ref == 'refs/heads/main' || inputs.push_latest == true }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
            org.opencontainers.image.vendor=codehunters
            io.codehunters.variant=${{ matrix.variant }}

      - name: Build amd64 image and run smoke test
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.context_dir }}/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ci-base-images:smoke-${{ matrix.variant }}-amd64
          cache-from: type=gha,scope=${{ matrix.cache_scope_prefix }}amd64
          cache-to: type=gha,scope=${{ matrix.cache_scope_prefix }}amd64,mode=max

      - name: Smoke test (amd64)
        env:
          IMAGE: ci-base-images:smoke-${{ matrix.variant }}-amd64
          KIND: ${{ matrix.smoke_kind }}
          VARIANT: ${{ matrix.smoke_variant }}
        run: ./scripts/run-smoke.sh

      # SARIF first, gate second. The gate is allowed to fail the job, so if it
      # ran first nothing would ever reach the Security tab on the run that
      # actually found something.
      #
      # Severity here is CRITICAL,HIGH for every variant regardless of the gate
      # tier: a HIGH in a CI image is worth seeing, just not worth blocking on.
      - name: Scan image (SARIF for code scanning)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ci-base-images:smoke-${{ matrix.variant }}-amd64
          scanners: vuln
          vuln-type: os,library
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          limit-severities-for-sarif: true
          trivyignores: .trivyignore.yaml
          ignore-policy: .trivy/ignore-policy.rego
          format: sarif
          output: trivy-${{ matrix.variant }}.sarif
          exit-code: '0'
          timeout: '15m'

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: trivy-${{ matrix.variant }}.sarif
          category: trivy-${{ matrix.variant }}

      # Publishing a base image with a fixable CRITICAL hands it to every
      # consumer that inherits from it, and they have no way to see it.
      - name: Vulnerability gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ci-base-images:smoke-${{ matrix.variant }}-amd64
          scanners: vuln
          vuln-type: os,library
          severity: ${{ matrix.scan_severity }}
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          ignore-policy: .trivy/ignore-policy.rego
          format: table
          exit-code: '1'
          timeout: '15m'
          skip-setup-trivy: true

      - name: Build arm64 image and run smoke test
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.context_dir }}/Dockerfile
          platforms: linux/arm64
          push: false
          load: true
          tags: ci-base-images:smoke-${{ matrix.variant }}-arm64
          cache-from: type=gha,scope=${{ matrix.cache_scope_prefix }}arm64
          cache-to: type=gha,scope=${{ matrix.cache_scope_prefix }}arm64,mode=max

      - name: Smoke test (arm64 via QEMU)
        env:
          IMAGE: ci-base-images:smoke-${{ matrix.variant }}-arm64
          KIND: ${{ matrix.smoke_kind }}
          VARIANT: ${{ matrix.smoke_variant }}
          PLATFORM: linux/arm64
        run: ./scripts/run-smoke.sh

      - name: Build and push multi-arch manifest
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.context_dir }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # An SPDX SBOM and max-mode provenance, attached to the manifest as
          # attestations. Without them a consumer inheriting this image has no
          # way to answer "what is in it" or "what built it" short of pulling it
          # apart, and neither question should require that.
          sbom: true
          provenance: mode=max
          cache-from: |
            type=gha,scope=${{ matrix.cache_scope_prefix }}amd64
            type=gha,scope=${{ matrix.cache_scope_prefix }}arm64
          cache-to: type=gha,scope=${{ matrix.cache_scope_prefix }}manifest,mode=max

      - name: Report image size
        run: |
          echo "### Image Published — ${{ matrix.variant }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | Digest |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          while IFS= read -r tag; do
            echo "| \`${tag}\` | \`${{ steps.push.outputs.digest }}\` |" >> $GITHUB_STEP_SUMMARY
          done <<< "${{ steps.meta.outputs.tags }}"
          echo "" >> $GITHUB_STEP_SUMMARY
          docker buildx imagetools inspect \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}" \
            >> $GITHUB_STEP_SUMMARY || true
