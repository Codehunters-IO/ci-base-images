name: Build & Publish CI Image

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'images/**'
      - 'scripts/**'
      - '.github/workflows/build-publish.yml'
  workflow_dispatch:
    inputs:
      push_latest:
        description: 'Tag as :latest (jdk) / :graalvm / :krakend / :node'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-publish:
    name: Build and Push (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        variant: [jdk, graalvm, krakend, node,
                  java-runtime, node-runtime, web-runtime, native-runtime]
        include:
          - variant: jdk
            smoke_kind: ci
            smoke_variant: jdk
            context_dir: images/ci/jdk
            tag_suffix: ''
            rolling_tag: latest
            cache_scope_prefix: jdk-
          - variant: graalvm
            smoke_kind: ci
            smoke_variant: graalvm
            context_dir: images/ci/graalvm
            tag_suffix: '-graalvm'
            rolling_tag: graalvm
            cache_scope_prefix: graalvm-
          - variant: krakend
            smoke_kind: ci
            smoke_variant: krakend
            context_dir: images/ci/krakend
            tag_suffix: '-krakend'
            rolling_tag: krakend
            cache_scope_prefix: krakend-
          - variant: node
            smoke_kind: ci
            smoke_variant: node
            context_dir: images/ci/node
            tag_suffix: '-node'
            rolling_tag: node
            cache_scope_prefix: node-
          - variant: java-runtime
            smoke_kind: runtime
            smoke_variant: java
            context_dir: images/runtime/java
            tag_suffix: '-java-runtime'
            rolling_tag: java-runtime
            cache_scope_prefix: java-runtime-
          - variant: node-runtime
            smoke_kind: runtime
            smoke_variant: node
            context_dir: images/runtime/node
            tag_suffix: '-node-runtime'
            rolling_tag: node-runtime
            cache_scope_prefix: node-runtime-
          - variant: web-runtime
            smoke_kind: web
            smoke_variant: web
            context_dir: images/runtime/web
            tag_suffix: '-web-runtime'
            rolling_tag: web-runtime
            cache_scope_prefix: web-runtime-
          - variant: native-runtime
            smoke_kind: native
            smoke_variant: native
            context_dir: images/runtime/native
            tag_suffix: '-native-runtime'
            rolling_tag: native-runtime
            cache_scope_prefix: native-runtime-

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
            suffix=${{ matrix.tag_suffix }},onlatest=true
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
            # suffix= clears the flavor suffix for this entry only. The rolling tag
            # already names the variant, so inheriting it produced graalvm-graalvm,
            # krakend-krakend and node-node on the first successful publish.
            type=raw,value=${{ matrix.rolling_tag }},suffix=,enable=${{ github.ref == 'refs/heads/main' || inputs.push_latest == true }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
            org.opencontainers.image.vendor=codehunters
            io.codehunters.variant=${{ matrix.variant }}

      - name: Build amd64 image and run smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.context_dir }}/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ci-base-images:smoke-${{ matrix.variant }}-amd64
          cache-from: type=gha,scope=${{ matrix.cache_scope_prefix }}amd64
          cache-to: type=gha,scope=${{ matrix.cache_scope_prefix }}amd64,mode=max

      - name: Smoke test (amd64)
        env:
          IMAGE: ci-base-images:smoke-${{ matrix.variant }}-amd64
          KIND: ${{ matrix.smoke_kind }}
          VARIANT: ${{ matrix.smoke_variant }}
        run: ./scripts/run-smoke.sh

      - name: Build arm64 image and run smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.context_dir }}/Dockerfile
          platforms: linux/arm64
          push: false
          load: true
          tags: ci-base-images:smoke-${{ matrix.variant }}-arm64
          cache-from: type=gha,scope=${{ matrix.cache_scope_prefix }}arm64
          cache-to: type=gha,scope=${{ matrix.cache_scope_prefix }}arm64,mode=max

      - name: Smoke test (arm64 via QEMU)
        env:
          IMAGE: ci-base-images:smoke-${{ matrix.variant }}-arm64
          KIND: ${{ matrix.smoke_kind }}
          VARIANT: ${{ matrix.smoke_variant }}
          PLATFORM: linux/arm64
        run: ./scripts/run-smoke.sh

      - name: Build and push multi-arch manifest
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.context_dir }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=${{ matrix.cache_scope_prefix }}amd64
            type=gha,scope=${{ matrix.cache_scope_prefix }}arm64
          cache-to: type=gha,scope=${{ matrix.cache_scope_prefix }}manifest,mode=max

      - name: Report image size
        run: |
          echo "### Image Published — ${{ matrix.variant }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | Digest |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          while IFS= read -r tag; do
            echo "| \`${tag}\` | \`${{ steps.push.outputs.digest }}\` |" >> $GITHUB_STEP_SUMMARY
          done <<< "${{ steps.meta.outputs.tags }}"
          echo "" >> $GITHUB_STEP_SUMMARY
          docker buildx imagetools inspect \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}" \
            >> $GITHUB_STEP_SUMMARY || true
