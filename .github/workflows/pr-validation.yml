name: PR Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'images/**'
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  hadolint:
    name: Dockerfile Lint (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: jdk
            dockerfile: images/ci/jdk/Dockerfile
          - variant: graalvm
            dockerfile: images/ci/graalvm/Dockerfile
          - variant: krakend
            dockerfile: images/ci/krakend/Dockerfile
          - variant: node
            dockerfile: images/ci/node/Dockerfile
          - variant: java-runtime
            dockerfile: images/runtime/java/Dockerfile
          - variant: node-runtime
            dockerfile: images/runtime/node/Dockerfile
          - variant: web-runtime
            dockerfile: images/runtime/web/Dockerfile
          - variant: native-runtime
            dockerfile: images/runtime/native/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - name: Hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          failure-threshold: warning
          ignore: DL3008,DL3018,DL3041

  shellcheck:
    name: Shell Script Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./scripts
          severity: warning

  build-test:
    name: Build & Smoke Test (${{ matrix.variant }}, amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: jdk
            smoke_kind: ci
            smoke_variant: jdk
            context_dir: images/ci/jdk
            cache_scope: jdk-pr-amd64
            scan_severity: 'CRITICAL'
          - variant: graalvm
            smoke_kind: ci
            smoke_variant: graalvm
            context_dir: images/ci/graalvm
            cache_scope: graalvm-pr-amd64
            scan_severity: 'CRITICAL'
          - variant: krakend
            smoke_kind: ci
            smoke_variant: krakend
            context_dir: images/ci/krakend
            cache_scope: krakend-pr-amd64
            scan_severity: 'CRITICAL'
          - variant: node
            smoke_kind: ci
            smoke_variant: node
            context_dir: images/ci/node
            cache_scope: node-pr-amd64
            scan_severity: 'CRITICAL'
          - variant: java-runtime
            smoke_kind: runtime
            smoke_variant: java
            context_dir: images/runtime/java
            cache_scope: java-runtime-pr-amd64
            scan_severity: 'CRITICAL,HIGH'
          - variant: node-runtime
            smoke_kind: runtime
            smoke_variant: node
            context_dir: images/runtime/node
            cache_scope: node-runtime-pr-amd64
            scan_severity: 'CRITICAL,HIGH'
          - variant: web-runtime
            smoke_kind: web
            smoke_variant: web
            context_dir: images/runtime/web
            cache_scope: web-runtime-pr-amd64
            scan_severity: 'CRITICAL,HIGH'
          - variant: native-runtime
            smoke_kind: native
            smoke_variant: native
            context_dir: images/runtime/native
            cache_scope: native-runtime-pr-amd64
            scan_severity: 'CRITICAL,HIGH'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.context_dir }}/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ci-base-images:pr-${{ matrix.variant }}-${{ github.event.pull_request.number }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,scope=${{ matrix.cache_scope }},mode=max

      - name: Smoke test
        env:
          IMAGE: ci-base-images:pr-${{ matrix.variant }}-${{ github.event.pull_request.number }}
          KIND: ${{ matrix.smoke_kind }}
          VARIANT: ${{ matrix.smoke_variant }}
        run: ./scripts/run-smoke.sh

      # Severity is per family, because the two families have opposite jobs.
      # A runtime image faces traffic, so a fixable HIGH in it is a defect. A CI
      # image is root with a toolchain by design and lives for one ephemeral
      # job; gating it on HIGH means blocking every PR on gcc and git advisories
      # nobody can act on, which trains people to ignore the gate.
      #
      # ignore-unfixed on both: an advisory with no upstream patch is not
      # actionable, and gating on it turns the check permanently red.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ci-base-images:pr-${{ matrix.variant }}-${{ github.event.pull_request.number }}
          scanners: vuln
          vuln-type: os,library
          severity: ${{ matrix.scan_severity }}
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          format: table
          output: trivy-${{ matrix.variant }}.txt
          exit-code: '1'
          timeout: '15m'

      - name: Publish scan result
        if: always()
        run: |
          {
            echo "### Vulnerability scan — ${{ matrix.variant }}"
            echo ""
            echo "Gate: \`${{ matrix.scan_severity }}\`, fixable only."
            echo ""
            echo '```'
            if [ -s "trivy-${{ matrix.variant }}.txt" ]; then
              head -c 40000 "trivy-${{ matrix.variant }}.txt"
            else
              echo "No vulnerabilities at or above the gate."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report image size
        if: always()
        run: |
          SIZE=$(docker image inspect ci-base-images:pr-${{ matrix.variant }}-${{ github.event.pull_request.number }} \
            --format '{{.Size}}')
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "### Image Size — ${{ matrix.variant }} (amd64, uncompressed)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**${SIZE_MB} MB**" >> $GITHUB_STEP_SUMMARY
