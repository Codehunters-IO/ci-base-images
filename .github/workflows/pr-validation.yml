name: PR Validation

# Lint, gate, build and smoke-test every image before it can be merged.
# Publishes nothing.
#
# The work lives in Codehunters-IO/ci-templates. Validating a container image is
# not a thing this repository does, it is a thing every repository that ships
# one does, and 264 lines of it sitting here meant the next repository started
# from `docker build` and inherited none of the scanning, the architecture
# matrix or the lint gates.

on:
  pull_request:
    branches: [main]
    paths:
      - 'images/**'
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  validate:
    # Pinned, not @v1: a reusable workflow resolves at call time, so a floating
    # alias means any release of ci-templates changes what runs here without a
    # commit in this repository. Bumping this pin is a reviewable change.
    uses: Codehunters-IO/ci-templates/.github/workflows/shared-validate-image-pr.yml@212e85796d4c9a646ce12f979df9f923e4d01582 # v1.5.0
    with:
      # Both architectures, because Build & Publish pushes a manifest for both.
      # Validating only amd64 here is what let an arm64-only break reach main
      # behind a green PR — the TARGETARCH shadowing bug was found that way,
      # after the fact.
      platforms: 'linux/amd64,linux/arm64'
      # Native arm64 rather than QEMU: the repository is public, so these cost
      # nothing, and a QEMU arm64 build of the GraalVM image takes long enough
      # that people stop waiting for it.
      runner_arm64: 'ubuntu-24.04-arm'
      smoke_command: './scripts/run-smoke.sh'
      gate_command: './scripts/check-pins.sh'
      gate_name: 'Pin Consistency'
      shellcheck_scandir: './scripts'
      hadolint_ignore: 'DL3008,DL3018,DL3041'
      trivyignores: '.trivyignore.yaml'
      ignore_policy: '.trivy/ignore-policy.rego'
      # Severity is per family, because the two families have opposite jobs. A
      # runtime image faces traffic, so a fixable HIGH in it is a defect. A CI
      # image is root with a toolchain by design and lives for one ephemeral
      # job; gating it on HIGH means blocking every PR on gcc and git
      # advisories nobody can act on, which trains people to ignore the gate.
      #
      # smoke_env carries what run-smoke.sh dispatches on. KIND picks how the
      # image is tested — baked-in script for CI, mounted for runtime, host-side
      # for the shell-less native image — and VARIANT picks the assertions. The
      # Java major is deliberately NOT passed: it travels inside the image as
      # CI_JAVA_MAJOR, so the check cannot be handed the answer it verifies.
      images: |
        [
          {"name": "jdk",            "dockerfile": "images/ci/jdk/Dockerfile",            "scan_severity": "CRITICAL",      "smoke_env": "KIND=ci\nVARIANT=jdk"},
          {"name": "jdk25",          "dockerfile": "images/ci/jdk25/Dockerfile",          "scan_severity": "CRITICAL",      "smoke_env": "KIND=ci\nVARIANT=jdk"},
          {"name": "graalvm",        "dockerfile": "images/ci/graalvm/Dockerfile",        "scan_severity": "CRITICAL",      "smoke_env": "KIND=ci\nVARIANT=graalvm"},
          {"name": "graalvm25",      "dockerfile": "images/ci/graalvm25/Dockerfile",      "scan_severity": "CRITICAL",      "smoke_env": "KIND=ci\nVARIANT=graalvm"},
          {"name": "krakend",        "dockerfile": "images/ci/krakend/Dockerfile",        "scan_severity": "CRITICAL",      "smoke_env": "KIND=ci\nVARIANT=krakend"},
          {"name": "node",           "dockerfile": "images/ci/node/Dockerfile",           "scan_severity": "CRITICAL",      "smoke_env": "KIND=ci\nVARIANT=node"},
          {"name": "java-runtime",   "dockerfile": "images/runtime/java/Dockerfile",      "scan_severity": "CRITICAL,HIGH", "smoke_env": "KIND=runtime\nVARIANT=java"},
          {"name": "java25-runtime", "dockerfile": "images/runtime/java25/Dockerfile",    "scan_severity": "CRITICAL,HIGH", "smoke_env": "KIND=runtime\nVARIANT=java"},
          {"name": "node-runtime",   "dockerfile": "images/runtime/node/Dockerfile",      "scan_severity": "CRITICAL,HIGH", "smoke_env": "KIND=runtime\nVARIANT=node"},
          {"name": "web-runtime",    "dockerfile": "images/runtime/web/Dockerfile",       "scan_severity": "CRITICAL,HIGH", "smoke_env": "KIND=web\nVARIANT=web"},
          {"name": "native-runtime", "dockerfile": "images/runtime/native/Dockerfile",    "scan_severity": "CRITICAL,HIGH", "smoke_env": "KIND=native"}
        ]
