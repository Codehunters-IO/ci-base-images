version: 2
updates:
  - package-ecosystem: "docker"
    directories:
      - "/images/ci/jdk"
      - "/images/ci/jdk25"
      - "/images/ci/graalvm"
      - "/images/ci/graalvm25"
      - "/images/ci/krakend"
      - "/images/ci/node"
      - "/images/runtime/java"
      - "/images/runtime/java25"
      - "/images/runtime/node"
      - "/images/runtime/web"
      - "/images/runtime/native"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"
    ignore:
      # The JDK major is this repo's contract, not a dependency detail. Each
      # directory IS a major — images/ci/jdk is 21, images/ci/jdk25 is 25 — and
      # the tag suffix, the io.codehunters.contents.java label, the README and
      # every consumer name it. A bump that moves only the FROM makes all of
      # them lie. A new major arrives as a new directory and a new tag suffix,
      # which is a release decision, not an update this can apply. Digests and
      # anything below the major still flow through.
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
      # Same, and it has to stay in step with the JDK the CI image builds against.
      # The name carries no registry host: Dependabot strips it, so the
      # "ghcr.io/graalvm/..." spelling this rule used until now matched nothing
      # and let the 21 -> 24 bump through (PR #22, open from 2026-09-03).
      - dependency-name: "graalvm/native-image-community"
        update-types: ["version-update:semver-major"]
      # Node 20 is deliberate: the consumers pin `engines: ">=20 <21"` because
      # their Hardhat toolchain and exactly-pinned crypto dependencies decide
      # bytes that get signed and anchored on a chain.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      # Go is not an independent dependency here: images/ci/krakend compiles
      # gateway plugins with `-buildmode=plugin`, and a plugin only loads into a
      # binary built by the same Go toolchain. The version that matters is the
      # one krakend:${KRAKEND_VERSION} was built with, which Dependabot cannot
      # see, so every standalone bump it proposes is wrong by construction (it
      # opened 1.25.7 -> 1.27.1 against a KrakenD built on 1.26.8). GO_VERSION
      # moves by hand when KRAKEND_VERSION moves — see images/ci/krakend for how
      # to read the value off the binary.
      - dependency-name: "golang"
      # Hard coupling, not policy: the native runtime stages libz out of this
      # image into gcr.io/distroless/base-debian12. Debian 13 here would pair a
      # libz built against one glibc with a userland built against another.
      # This moves when the distroless base does, and not before.
      - dependency-name: "debian"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
